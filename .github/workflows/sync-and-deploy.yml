name: 🔄 自动同步 FMHY 数据

on:
  # 每天北京时间早上 8 点自动执行（UTC 0:00）
  schedule:
    - cron: '0 0 * * *'
  # 也可以在 GitHub Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装 Python 依赖
        run: pip install requests

      - name: 🕷️ 克隆 FMHY 源仓库
        run: |
          rm -rf /tmp/fmhy_repo
          git clone --depth 1 https://github.com/fmhy/edit.git /tmp/fmhy_repo

      - name: 🔨 执行数据爬取与解析
        run: python3 scripts/build_data_fast.py

      - name: 📊 检查数据变化
        id: check
        run: |
          if git diff --quiet public/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ 数据无变化，跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 检测到数据更新"
          fi

      - name: 📤 提交更新的数据
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "🔄 自动同步 FMHY 数据 $(date +'%Y-%m-%d %H:%M')"
          git push

  deploy:
    needs: sync-data
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出最新代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 📦 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 安装前端依赖
        run: pnpm install

      - name: 🏗️ 构建项目
        run: pnpm build

      - name: 🚀 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
